<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1020" />
  <title>ABF Field Shift: logo animation</title>
  <link rel="icon" type="image/svg+xml" href="/img/abf-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="/logo.css" />
  <style>
    /* Full-screen stage for screen recording (1920x1080). Press R or click to replay. */
    html, body { margin: 0; height: 100%; background: #0A1020; }
    body { display: grid; place-items: center; overflow: hidden; cursor: pointer; -webkit-font-smoothing: antialiased; }
    .stage .abf-logo { font-size: clamp(44px, 10.5vmin, 116px); gap: 0.42em; }
    .stage .abf-mark { width: clamp(150px, 36vmin, 400px); height: auto; }
    .stage .abf-powered { font-size: max(0.18em, 12px); }
    .hint { position: fixed; right: 16px; bottom: 12px; margin: 0; font: 500 12px 'Inter', system-ui, sans-serif; color: rgba(154, 164, 204, 0.45); }
    @media (max-width: 480px) { .stage .abf-logo { font-size: 15vw; } .stage .abf-mark { width: 52vw; } }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="abf-logo" role="img" aria-label="ABF Field Shift. Powered by NASA data">
      <svg class="abf-mark" viewBox="0 0 200 200" aria-hidden="true">
        <defs><clipPath id="abfClipFull"><circle cx="100" cy="100" r="62"/></clipPath></defs>
        <circle class="m-planet" cx="100" cy="100" r="62" fill="#2F4BFF"/>
        <g clip-path="url(#abfClipFull)" fill="none" stroke="#D4F20C" stroke-width="6" stroke-linecap="round">
          <path class="m-row r1" pathLength="1" d="M30 112 Q100 84 170 112"/>
          <path class="m-row r2" pathLength="1" d="M30 132 Q100 104 170 132"/>
          <path class="m-row r3" pathLength="1" d="M30 152 Q100 124 170 152"/>
        </g>
        <g class="m-orbit">
          <ellipse class="m-ring" pathLength="1" cx="100" cy="100" rx="92" ry="30" transform="rotate(-24 100 100)" fill="none" stroke="#F2F5FB" stroke-width="4"/>
          <circle class="m-sat" cx="170.7" cy="54.4" r="9" fill="#D4F20C"/>
        </g>
      </svg>
      <div class="abf-words" aria-hidden="true">
        <div class="abf-big"><span>A</span><span>B</span><span>F</span></div>
        <div class="abf-small">Field Shift</div>
        <div class="abf-line"></div>
        <div class="abf-powered">Powered by NASA data</div>
      </div>
    </div>
  </main>
  <p class="hint">R or click: replay</p>
  <script>
    // Replay only: restart every CSS animation by re-inserting the logo
    (function () {
      const stage = document.getElementById('stage');
      function replay() { const logo = stage.firstElementChild; const copy = logo.cloneNode(true); stage.replaceChild(copy, logo); }
      document.addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') replay(); });
      document.addEventListener('click', replay);
    })();
  </script>
</body>
</html>
